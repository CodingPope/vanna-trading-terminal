name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc -b --force

      - name: Unit tests
        run: yarn test:run

      - name: Build
        run: yarn build

      # Runs after the build because it reads what the build measured.
      - name: Bundle budgets
        run: yarn budget

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7

      # The analysis is what makes a budget failure actionable, so it is kept
      # whether the budgets passed or not.
      - name: Upload bundle analysis
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bundle-analysis
          path: dist/bundle-analysis.json
          retention-days: 30

  # Browser-level checks.
  #
  # A separate job because it needs a Python runtime, the API running, and a
  # Chromium download — and because the job above is the fast signal. Every bug
  # this catches passed lint, typecheck and the unit suite: a grid rendering no
  # rows, a control that changes a highlight and nothing else, a book that
  # crosses, a shortcut bound to a chord no browser emits.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install server dependencies
        run: pip install -r server/requirements-dev.txt

      # No .env exists on this runner, so this override is redundant here --
      # it documents the contract that a local .env pointed at a real
      # recorded fixture must never change what the suite exercises.
      - name: Server tests
        working-directory: server
        env:
          VANNA_DATA_MODE: synthetic
          VANNA_FIXTURE: ""
        run: python -m unittest discover -s tests -v

      # Cached separately from node_modules: the browser is ~150MB and changes
      # only with the Playwright version.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: yarn e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Feed benchmark.
  #
  # Thresholds are set wide on purpose: this is here to catch a stream that
  # starts shedding, stalling, or losing frames, not to police milliseconds on a
  # shared runner. The artifact is uploaded either way, so a number can be
  # traced back to the run that produced it.
  benchmark:
    name: Feed benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run benchmark
        run: yarn benchmark

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark
          path: |
            benchmark/results/
            docs/benchmarks/latest.md
          retention-days: 30
